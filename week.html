<style>
*{box-sizing:border-box}body{margin:0;background:#f5f1e8;color:#18231e;font-family:Arial,sans-serif}.shell{display:none;width:min(940px,calc(100% - 28px));margin:auto;padding:28px 0 55px}.gate{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(520px,100%);background:#fffdf8;border:1px solid #d7ddd6;border-radius:20px;padding:34px;text-align:center;box-shadow:0 18px 60px #18231e18}small{color:#245b48;font-weight:800;letter-spacing:.13em;text-transform:uppercase}h1{font:500 clamp(2.35rem,7vw,4.4rem)/1 Georgia;margin:6px 0 12px}h2{font:500 2rem Georgia;margin:5px 0}.muted,.status{color:#647169;line-height:1.5}.signin,.primary{background:#245b48;color:#fff;border-color:#245b48}button,.button{border:1px solid #c9d1ca;border-radius:11px;background:transparent;color:#526159;padding:11px 13px;font-weight:800;cursor:pointer;text-decoration:none}.account{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.account-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.account-actions span{color:#647169;font-size:.8rem}.weekbar{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;border-top:2px solid #18231e;border-bottom:1px solid #c9d1ca;margin:24px 0 18px;padding:17px 0;text-align:center}.weekbar button:disabled{opacity:.35}.daytabs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:28px}.daytabs button.on{background:#245b48;color:#fff}.summary{display:flex;justify-content:space-between;align-items:end;margin-bottom:15px}.lessons{display:grid;gap:12px}.lesson{background:#fffdf8;border:1px solid #d7ddd6;border-radius:16px;overflow:hidden}.lesson.done{background:#e8efe8}.lesson-head{display:grid;grid-template-columns:32px 60px 1fr auto;gap:11px;align-items:center;padding:15px}.lesson input[type=checkbox]{width:23px;height:23px;accent-color:#245b48}.lesson.done h3{text-decoration:line-through;opacity:.7}time{color:#647169;font-weight:800;font-size:.9rem}h3{font:600 1.18rem Georgia;margin:0}.lessonline{color:#647169;font-size:.84rem;margin-top:4px}.expand{padding:9px 11px}.detail{display:none;border-top:1px solid #d7ddd6;padding:18px}.lesson.open .detail{display:block}.text{white-space:pre-wrap;font:400 .96rem/1.58 Arial;color:#28352f}.resources{display:flex;gap:8px;flex-wrap:wrap;margin:17px 0}.resources a{display:inline-block;background:#245b48;color:#fff;border-radius:9px;padding:10px 12px;text-decoration:none;font-size:.84rem;font-weight:800}.notes{border-top:1px solid #e0e4df;margin-top:18px;padding-top:16px}.notes label{display:block;font-weight:800;margin-bottom:7px}.notes textarea{width:100%;min-height:88px;resize:vertical;border:1px solid #bfc9c1;border-radius:10px;background:#fff;padding:11px;font:inherit;color:#18231e}.notes-row{display:flex;align-items:center;gap:10px;margin-top:8px}.saved{font-size:.82rem;color:#647169}.empty{background:#fffdf8;border:1px solid #d7ddd6;border-radius:16px;padding:34px;text-align:center}.back{display:inline-block;margin-top:20px;color:#245b48;font-weight:800}.loading{text-align:center;padding:50px;color:#647169}@media(max-width:640px){.shell{padding-top:18px}.account{display:block}.account-actions{justify-content:flex-start;margin-top:12px}.weekbar{grid-template-columns:1fr 1fr}.weektitle{grid-column:1/-1;grid-row:1}.lesson-head{grid-template-columns:28px 48px 1fr}.expand{grid-column:2/-1}.daytabs{gap:5px}.daytabs button{padding:11px 2px}.full{display:none}}
.carry{margin-top:34px;padding-top:24px;border-top:2px solid #b0703e}.carry small{color:#955a2b}.carry .lesson{border-color:#dfc3aa;background:#fffaf3}.origin{display:inline-block;color:#955a2b;font-weight:800;margin-right:7px}.leave{background:#fff;color:#77543a}
.assigned{margin-top:34px;padding-top:24px;border-top:2px solid #18231e}.assigned .lesson{background:#f0eadf}
</style>
<section class="gate" id="gate"><div class="card"><small>Zephaniah — Grade 7</small><h1>Detailed Week</h1><p class="muted">Sign in with an approved family Google account to see lesson instructions and notes.</p><button class="signin" id="signin">Continue with Google</button><div class="status" id="gateStatus">Checking sign-in…</div></div></section>
<main class="shell" id="app"><header><div class="account"><div><small>Zephaniah — Grade 7</small><h1>Detailed Week</h1></div><div class="account-actions"><span id="signedInAs"></span><button id="importWeek" hidden>Import prepared week</button><input id="weekFile" type="file" accept="application/json" hidden><a class="button" href="index.html">Home</a><button id="signout">Sign out</button></div></div></header><section class="weekbar"><button id="prev">← Previous</button><div class="weektitle"><small>School week</small><h2 id="weekLabel">Loading…</h2></div><button id="next">Next →</button></section><nav class="daytabs" id="daytabs"></nav><section id="content"><div class="loading">Loading the detailed plan…</div></section></main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';
import {getAuth,GoogleAuthProvider,onAuthStateChanged,signInWithPopup,signInWithRedirect,getRedirectResult,signOut} from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';
import {getFirestore,doc,getDoc,onSnapshot,setDoc,serverTimestamp} from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';
const config={apiKey:'AIzaSyCeQmiBHTT7Wys_1PUjlFLupuF66XzWWQE',authDomain:'zephaniah-school-day.firebaseapp.com',projectId:'zephaniah-school-day',storageBucket:'zephaniah-school-day.firebasestorage.app',messagingSenderId:'506022337658',appId:'1:506022337658:web:9ca7f431ed3a36d3a9efc3'};
const fb=initializeApp(config),auth=getAuth(fb),db=getFirestore(fb),provider=new GoogleAuthProvider(),approved=new Set(['karenennema@gmail.com','zephaniahennema@gmail.com']);
const resourceIds={'Copywork':'recGRj2yx5IFvoFVJ','Grammar/Comp':'recXtDJumB0O83W4t','Composer Study':'rec4XnBqT5hGzgekf','Poetry Reading':'recnGtrrxLZQpoc2I','World History':'rec2Ve2pxnvaAIg4K','Lit./Mythology':'recrSWSoC0yNwPHrT','Dictation':'recfOQoYQm547LzPW','Recitation':'recgBJaELI11Rfass','Ethics':'rectUKirSyNdJhvrY','Canadian History':'recjFbzbQHFiDKuEN','Canadian Geography':'recmcMLVf0UYM6aBz','French':'french.html','General Science':'recweO1dzNgjFJDZl','Bible: Old Testament':'rec7uZOhGTkCcJ1MV','Ancient History':'rec35HIIi6CIj2I0T','Shakespeare':'rec1g1GjHgu1HrWa6','Sol-fa':'recWSRUTH4rJpHVYC','Church History':'reckBY6n4BStSljpd','Canadian Government':'recIVyFFuzbJhFIAy','Natural History':'recweO1dzNgjFJDZl','Plutarch':'recLxHIpB9s53QHpZ','Bible: Spiritual Formation':'recExExdfIdNRyBus','Current Events':'recbShXLUHkG4uxBl','Hymns':'reczI18s7yrqe1poa','Folk Songs':'recH2WghU2kFg2Bsh','Picture Study':'recFSJV8jlfXuHc0X','Poetry Study':'recwsiRVhKWADoRcy','Community Read':'recFveiRQJWXaIwRJ','Science Lab':'recN5n38Wp9qNytu4'};
let weekId='2026-09-14',week=null,day='',state={done:[],notes:{}},unsub=null,user=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const monday=d=>{const x=new Date(d+'T12:00:00'),n=(x.getDay()+6)%7;x.setDate(x.getDate()-n);return x.toISOString().slice(0,10)};
const shift=(id,n)=>{const d=new Date(id+'T12:00:00');d.setDate(d.getDate()+n*7);return d.toISOString().slice(0,10)};
function resource(subject){const key=Object.keys(resourceIds).find(k=>subject.includes(k));if(!key)return'';const id=resourceIds[key];return id.endsWith('.html')?id:`https://planning.alveary.org/links.html?id=${id}&term=1&week=1`}
function showGate(msg){gate.style.display='grid';app.style.display='none';gateStatus.textContent=msg||''}function showApp(){gate.style.display='none';app.style.display='block';signedInAs.textContent=user.email}
async function loadWeek(id){weekId=id;week=null;content.innerHTML='<div class="loading">Loading the detailed plan…</div>';weekLabel.textContent='Loading…';if(unsub){unsub();unsub=null}const snap=await getDoc(doc(db,'weeks',id));if(!snap.exists()){renderMissing(id);return}week=snap.data();const names=Object.keys(week.days||{});const today=new Date().toLocaleDateString('en-US',{weekday:'long'});day=names.includes(today)&&monday(new Date().toISOString().slice(0,10))===id?today:names[0];unsub=onSnapshot(doc(db,'weekProgress',id),s=>{state=s.exists()?s.data():{done:[],notes:{}};state.done=state.done||[];state.notes=state.notes||{};render()});}
function renderMissing(id){const d=new Date(id+'T12:00:00');weekLabel.textContent=d.toLocaleDateString('en-CA',{month:'long',day:'numeric',year:'numeric'});daytabs.innerHTML='';content.innerHTML='<div class="empty"><h2>No detailed plan has been added for this week</h2><p class="muted">The regular subject page is still available whenever a detailed week has not been prepared.</p><a class="back" href="index.html">Open the regular school day →</a></div>';prev.disabled=false;next.disabled=false}
function lessonCard(x,origin=''){const done=new Set(state.done),link=resource(x.subject),note=state.notes[x.id]||'',lessonLine=x.text.split('\n')[0]||'Lesson details',suffix=origin?'-carry':'';return `<article class="lesson ${done.has(x.id)?'done':''}" id="lesson-${esc(x.id)}${suffix}"><div class="lesson-head"><input type="checkbox" data-check="${esc(x.id)}" ${done.has(x.id)?'checked':''}><time>${esc(x.time||'—')}</time><div>${origin?`<span class="origin">${esc(origin)}</span>`:''}<h3>${esc(x.subject)}</h3><div class="lessonline">${esc(lessonLine)}</div></div><button class="expand" data-target="lesson-${esc(x.id)}${suffix}">View lesson</button></div><div class="detail"><div class="text">${esc(x.text)}</div>${link?`<div class="resources"><a target="_blank" href="${esc(link)}">Open resources ↗</a></div>`:''}<div class="notes"><label>Your note</label><textarea data-note="${esc(x.id)}" placeholder="Add your own note for this lesson…">${esc(note)}</textarea><div class="notes-row"><button class="primary" data-save="${esc(x.id)}">Save note</button>${origin?`<button class="leave" data-leave="${esc(x.id)}">Leave on ${esc(origin)}</button>`:''}<span class="saved" data-saved="${esc(x.id)}">${note?'Saved':''}</span></div></div></div></article>`}
function render(){if(!week)return;showApp();weekLabel.textContent=week.label;const names=Object.keys(week.days),done=new Set(state.done),left=new Set(state.leaveOnDay||[]);daytabs.innerHTML=names.map(n=>`<button class="${n===day?'on':''}" data-day="${esc(n)}">${n.slice(0,3)}<span class="full">${n.slice(3)}</span></button>`).join('');daytabs.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{day=b.dataset.day;render()});const lessons=week.days[day].lessons||[],timed=lessons.filter(x=>x.time),assigned=lessons.filter(x=>!x.time),carry=[];names.slice(0,names.indexOf(day)).forEach(n=>(week.days[n].lessons||[]).forEach(x=>{if(!done.has(x.id)&&!left.has(x.id))carry.push({...x,origin:n})}));content.innerHTML=`<section class="summary"><div><small>Daily plan</small><h2>${esc(day)}</h2><div class="muted">${new Date(week.days[day].date+'T12:00:00').toLocaleDateString('en-CA',{month:'long',day:'numeric',year:'numeric'})}</div></div><b>${lessons.filter(x=>done.has(x.id)).length} of ${lessons.length} done</b></section>${carry.length?`<section class="carry"><small>Still to finish from earlier this week</small><h2>Finish First</h2><p class="muted">Complete these before moving to the next lesson in the same subject, or leave an item on its original day.</p><div class="lessons">${carry.map(x=>lessonCard(x,x.origin)).join('')}</div></section>`:''}<div class="lessons">${timed.map(x=>lessonCard(x)).join('')}</div>${assigned.length?`<section class="assigned"><small>No fixed time</small><h2>Do as Assigned</h2><div class="lessons">${assigned.map(x=>lessonCard(x)).join('')}</div></section>`:''}`;wire()}
function wire(){document.querySelectorAll('[data-expand]').forEach(b=>b.onclick=()=>{const a=document.getElementById(b.dataset.target);a.classList.toggle('open');b.textContent=a.classList.contains('open')?'Hide lesson':'View lesson'});document.querySelectorAll('[data-check]').forEach(b=>b.onchange=async()=>{const set=new Set(state.done);b.checked?set.add(b.dataset.check):set.delete(b.dataset.check);await setDoc(doc(db,'weekProgress',weekId),{done:[...set],updatedAt:serverTimestamp()},{merge:true})});document.querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{const id=b.dataset.save,boxes=[...document.querySelectorAll(`[data-note="${CSS.escape(id)}"]`)],value=(boxes.find(x=>x.offsetParent!==null)||boxes[0]).value;await setDoc(doc(db,'weekProgress',weekId),{notes:{...state.notes,[id]:value},updatedAt:serverTimestamp()},{merge:true});document.querySelectorAll(`[data-saved="${CSS.escape(id)}"]`).forEach(s=>s.textContent='Saved')});document.querySelectorAll('[data-leave]').forEach(b=>b.onclick=async()=>{const set=new Set(state.leaveOnDay||[]);set.add(b.dataset.leave);await setDoc(doc(db,'weekProgress',weekId),{leaveOnDay:[...set],updatedAt:serverTimestamp()},{merge:true})})}
prev.onclick=()=>loadWeek(shift(weekId,-1));next.onclick=()=>loadWeek(shift(weekId,1));signin.onclick=async()=>{gateStatus.textContent='Opening Google sign-in…';try{await signInWithPopup(auth,provider)}catch(e){if(e.code==='auth/popup-blocked'||e.code==='auth/cancelled-popup-request')await signInWithRedirect(auth,provider);else gateStatus.textContent='Sign-in was not completed. Please try again.'}};signout.onclick=()=>signOut(auth);getRedirectResult(auth).catch(()=>{});
importWeek.onclick=()=>weekFile.click();weekFile.onchange=async()=>{if(!weekFile.files[0])return;importWeek.textContent='Importing…';importWeek.disabled=true;try{const data=JSON.parse(await weekFile.files[0].text());await setDoc(doc(db,'weeks',data.id),data);await loadWeek(data.id);importWeek.textContent='Week imported'}catch(e){importWeek.textContent='Import failed';importWeek.disabled=false}};
onAuthStateChanged(auth,async u=>{if(!u){user=null;showGate('Please sign in to continue.');return}if(!approved.has((u.email||'').toLowerCase())){await signOut(auth);showGate('That Google account is not approved for this page.');return}user=u;importWeek.hidden=(u.email||'').toLowerCase()!=='karenennema@gmail.com';showApp();loadWeek(monday(new Date().toISOString().slice(0,10))).catch(()=>showGate('The detailed plan could not be loaded. Please try again.'))});
</script></html>
